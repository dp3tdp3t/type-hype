name: build

# Triggers:
#   - Pushing a tag like `v0.1.0`     → full release build + GitHub Release
#   - Manually from the Actions tab  → just produces artifacts
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: type-hype-macos
            ext: zip
          - os: windows-latest
            artifact_name: type-hype-windows
            ext: zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      # Icons are generated rather than committed, so each runner
      # rebuilds them. The script knows to skip .icns on non-mac.
      - name: Generate icons
        run: python scripts/generate_icon.py

      - name: Build with PyInstaller
        run: pyinstaller typehype.spec --clean --noconfirm

      # ---- macOS packaging ----
      - name: Package macOS .app
        if: runner.os == 'macOS'
        working-directory: dist
        run: |
          # `ditto` preserves the .app bundle's metadata correctly
          # (PyInstaller's signing, resource forks, etc.) in a way
          # plain `zip` does not.
          ditto -c -k --sequesterRsrc --keepParent "type hype.app" "${{ matrix.artifact_name }}.zip"

      # ---- Windows packaging ----
      - name: Package Windows folder
        if: runner.os == 'Windows'
        working-directory: dist
        shell: pwsh
        run: |
          Compress-Archive -Path "type hype" -DestinationPath "${{ matrix.artifact_name }}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}.zip
          if-no-files-found: error

  release:
    # Only run on tag pushes; collect both OS artifacts and attach
    # them to a GitHub Release.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true
